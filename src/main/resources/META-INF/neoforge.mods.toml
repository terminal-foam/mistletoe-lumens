modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Mistletoe Lumens"
logoFile="mistletoe-logo.png"
logoBlur=false
authors="星光"
description='''槲寄生 流光（Mistletoe Lumens）—— 以生命差额为刃、以献祭换取弑神的原创拔刀剑，另有流明·星与她的随从。SlashBlade Resharped 附属模组。'''

[[mixins]]
config="mistletoe.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="slashblade"
type="required"
versionRange="${slashblade_version_range}"
ordering="AFTER"
side="BOTH"
[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="${geckolib_version_range}"
ordering="AFTER"
side="BOTH"
